<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quan Trắc Vĩ Mô - Lê Thế Bảo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f1f3f5; }
        #map { height: 400px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .control-panel { background: white; padding: 20px; border-radius: 15px; }
    </style>
</head>
<body>
    <div class="container py-4">
        <h2 class="text-center mb-4">🌍 Trạm Quan Trắc Không Khí Vĩ Mô</h2>

        <div id="map"></div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="control-panel shadow-sm">
                    <h5>Gửi dữ liệu thử nghiệm</h5>
                    <hr>
                    <input type="text" id="devId" class="form-control mb-2" placeholder="Tên trạm (VD: Tram_HaNoi)">
                    <div class="row g-2 mb-2">
                        <div class="col"><input type="number" id="lat" class="form-control" placeholder="Vĩ độ (Lat)"></div>
                        <div class="col"><input type="number" id="lon" class="form-control" placeholder="Kinh độ (Lon)"></div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col"><input type="number" id="aqi" class="form-control" placeholder="Chỉ số AQI"></div>
                    </div>
                    <button onclick="sendData()" class="btn btn-primary w-100 mb-2">📍 Gửi vị trí & Dữ liệu</button>
                    <button onclick="clearAll()" class="btn btn-outline-danger w-100 mt-4">🗑️ Xóa sạch dữ liệu cũ</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="bg-white p-3 rounded shadow-sm" style="height: 450px; overflow-y: auto;">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Trạm</th>
                                <th>AQI</th>
                                <th>Tọa độ</th>
                                <th>Thời gian</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Khởi tạo bản đồ
        var map = L.map('map').setView([16.0, 108.0], 6); // Nhìn toàn bộ Việt Nam
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var markerGroup = L.layerGroup().addTo(map);

        // 2. Hàm lấy dữ liệu từ Server
        async function refresh() {
            const res = await fetch('/get-data');
            const data = await res.json();
            
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            markerGroup.clearLayers(); // Xóa các điểm cũ trên bản đồ

            data.forEach(row => {
                // Đổ vào bảng
                const tr = `<tr>
                    <td><b>${row.device_id}</b></td>
                    <td>${row.mq135}</td>
                    <td><small>${row.lat}, ${row.lon}</small></td>
                    <td>${new Date(row.created_at).toLocaleTimeString()}</td>
                </tr>`;
                tbody.innerHTML += tr;

                // Vẽ lên bản đồ
                if(row.lat && row.lon) {
                    L.marker([row.lat, row.lon])
                     .addTo(markerGroup)
                     .bindPopup(`<b>${row.device_id}</b><br>AQI: ${row.mq135}`);
                }
            });
        }

        // 3. Hàm gửi dữ liệu từ Form (Giả lập thiết bị gửi)
        async function sendData() {
            const body = {
                deviceId: document.getElementById('devId').value || "Unnamed",
                lat: parseFloat(document.getElementById('lat').value),
                lon: parseFloat(document.getElementById('lon').value),
                mq135: parseFloat(document.getElementById('aqi').value) || 0,
                temp: 25, humid: 60, dust: 10
            };
            await fetch('/update-sensor', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            refresh();
        }

        // 4. Hàm xóa sạch
        async function clearAll() {
            if(confirm("Bạn muốn xóa hết lịch sử dữ liệu?")) {
                await fetch('/delete-all', { method: 'DELETE' });
                refresh();
            }
        }

        setInterval(refresh, 5000);
        refresh();
    </script>
</body>
</html>
