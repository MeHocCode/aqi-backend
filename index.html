<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Quan Trắc Vĩ Mô - Lê Thế Bảo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; border-radius: 15px; cursor: crosshair; }
        .info-panel { position: absolute; top: 20px; right: 20px; z-index: 1000; width: 300px; }
    </style>
</head>
<body class="bg-dark">
    <div class="container-fluid p-4">
        <div class="row">
            <div class="col-md-9 position-relative">
                <div id="map" class="shadow-lg"></div>
                <div class="info-panel">
                    <div class="card shadow">
                        <div class="card-body">
                            <h6>Hướng dẫn:</h6>
                            <small class="text-muted">Click vào bản đồ để thiết lập vị trí mới cho thiết bị.</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 text-white">
                <h4>📊 Danh sách trạm</h4>
                <div id="status-list" class="mt-3"></div>
                <button onclick="clearLogs()" class="btn btn-sm btn-outline-danger mt-4">Xóa lịch sử đo</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">📍 Định vị thiết bị mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="regId" class="form-control mb-2" placeholder="Tên thiết bị (VD: TRAM_01)">
                    <input type="text" id="regName" class="form-control mb-2" placeholder="Tên địa chỉ (VD: Nhà Bảo)">
                    <div class="row">
                        <div class="col"><input type="text" id="regLat" class="form-control" readonly></div>
                        <div class="col"><input type="text" id="regLon" class="form-control" readonly></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button onclick="confirmRegister()" class="btn btn-primary">Lưu vị trí</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([10.84, 106.81], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var markerGroup = L.layerGroup().addTo(map);
        var regModal = new bootstrap.Modal(document.getElementById('registerModal'));

        // KHI CLICK VÀO BẢN ĐỒ -> HIỆN POPUP
        map.on('click', function(e) {
            document.getElementById('regLat').value = e.latlng.lat.toFixed(6);
            document.getElementById('regLon').value = e.latlng.lng.toFixed(6);
            regModal.show();
        });

        async function confirmRegister() {
            const data = {
                deviceId: document.getElementById('regId').value,
                locationName: document.getElementById('regName').value,
                lat: parseFloat(document.getElementById('regLat').value),
                lon: parseFloat(document.getElementById('regLon').value)
            };
            await fetch('/register-device', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            regModal.hide();
            updateMap();
        }

        async function updateMap() {
            const res = await fetch('/get-map-data');
            const devices = await res.json();
            
            markerGroup.clearLayers();
            const list = document.getElementById('status-list');
            list.innerHTML = '';

            devices.forEach(dev => {
                const aqi = dev.mq135 || 0;
                const color = aqi > 100 ? 'red' : 'green';
                
                // Vẽ Marker
                L.circleMarker([dev.lat, dev.lon], { color: color, radius: 10 }).addTo(markerGroup)
                 .bindPopup(`<b>${dev.location_name}</b><br>AQI: ${aqi}<br>ID: ${dev.device_id}`);

                // Đổ vào danh sách bên phải
                list.innerHTML += `
                    <div class="card mb-2 text-dark">
                        <div class="card-body p-2">
                            <h6 class="m-0">${dev.location_name} <small class="text-muted">(${dev.device_id})</small></h6>
                            <div class="d-flex justify-content-between">
                                <span class="badge bg-secondary">AQI: ${aqi}</span>
                                <small>${dev.created_at ? new Date(dev.created_at).toLocaleTimeString() : 'Ngoại tuyến'}</small>
                            </div>
                        </div>
                    </div>`;
            });
        }

        setInterval(updateMap, 5000);
        updateMap();
    </script>
</body>
</html>
